/* cli: terminal version of the game. Runnable app that uses core. */
plugins {
    id 'application'
}

dependencies {
    implementation(project(':core'))
}

application {
    mainClass = 'tech.ty700.blackjack.cli.Main'
    applicationName = 'blackjack'
}

/* Release archives: blackjack-cli-<version>.zip and .tar */
distributions {
    main {
        distributionBaseName = 'blackjack-cli'
    }
}

/* Lets Scanner read keyboard input when using ./gradlew :cli:run */
run {
    standardInput = System.in
}
