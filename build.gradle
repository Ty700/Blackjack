/*
 * Root build file. Settings in subprojects { } apply to every module
 * listed in settings.gradle (core, cli), like a parent CMakeLists.txt.
 */
subprojects {
    apply plugin: 'java'

    group = 'tech.ty700'
    version = '0.0.1'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}
